name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  client:
    name: Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: SSR smoke
        run: npm run test:ssr

  move:
    name: Move
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Aptos CLI
        env:
          APTOS_CLI_VERSION: "9.5.0"
        run: |
          npm install --global @aptos-labs/aptos-cli@3.0.0
          npx --yes @aptos-labs/aptos-cli@3.0.0 --install
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/aptos" --version
      - name: Compile tic-tac-toe
        working-directory: move
        run: aptos move compile --named-addresses deploy_account=0xA11CE
      - name: Compile checkers
        working-directory: move/checkers
        run: aptos move compile --named-addresses deploy_account=0xA11CE
