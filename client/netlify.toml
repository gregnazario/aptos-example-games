# Let's not use the "netlify" domain
[[redirects]]
  from = "https://aptos-tic-tac-toe.netlify.app"
  to = "https://gnazar.io"
  status = 301
  force = true

[build]
  command = "npm run build"
  # Nitro's netlify preset writes static assets (and _redirects) to dist/, not .output/public.
  publish = "dist"

[build.environment]
  NITRO_PRESET = "netlify"
  NODE_VERSION = "22"

[dev]
  command = "npm start"
  port = 3000
